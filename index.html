<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoSpider</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box !important;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        header.custom-header {
            background-color: #2c3e50 !important;
            padding: 20px !important;
            display: block !important;
            width: 100% !important;
        }

        .header-container {
            max-width: 800px !important;
            margin: 0 auto !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            flex-wrap: wrap !important;
        }

        .header-container h1 {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 2rem !important;
            color: #ffffff !important;
            text-transform: none !important;
            font-weight: bold !important;
            line-height: 1 !important;
        }

        /* Навигация с единым базовым выравниванием */
        nav.custom-nav {
            display: flex !important;
            align-items: center !important;
            gap: 20px;
        }

        nav.custom-nav > a,
        .dropdown-trigger {
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 1rem !important;
            line-height: 1.5 !important;
            padding: 6px 0 !important;
            margin: 0 !important;
            display: inline-flex !important;
            align-items: center !important;
            cursor: pointer;
            transition: color 0.3s !important;
        }

        nav.custom-nav > a:hover,
        .dropdown-trigger:hover {
            color: #1abc9c !important;
        }

        /* Контейнер выпадающего меню */
        .dropdown {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        /* Выпадающее окно */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            margin-top: 6px;
            background-color: #ffffff !important;
            min-width: 220px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            border-radius: 6px;
            overflow: hidden;
            z-index: 1000;
            border: 1px solid #e2e8f0;
        }

        /* Невидимый мостик, чтобы меню не закрывалось при движении мыши */
        .dropdown-menu::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: transparent;
        }

        /* Ссылки внутри выпадающего списка */
        nav.custom-nav .dropdown-menu a {
            color: #2c3e50 !important;
            padding: 12px 16px !important;
            margin: 0 !important;
            display: block !important;
            text-decoration: none !important;
            font-size: 0.95rem !important;
            line-height: 1.4 !important;
            text-align: left !important;
            background-color: #ffffff !important;
            transition: background 0.2s, color 0.2s !important;
        }

        nav.custom-nav .dropdown-menu a:hover {
            background-color: #f1f5f9 !important;
            color: #1abc9c !important;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: #fff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column !important;
                text-align: center !important;
            }

            .header-container h1 {
                margin-bottom: 15px !important;
            }

            nav.custom-nav {
                gap: 15px;
            }

            .dropdown-menu {
                right: auto;
                left: 50%;
                transform: translateX(-50%);
            }

            main {
                margin: 20px 10px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header class="custom-header">
        <div class="header-container">
            <h1>LoSpider</h1>
            <nav class="custom-nav">
                <a href="index.html">Home</a>
                <div class="dropdown">
                    <span class="dropdown-trigger">Privacy Policy ▾</span>
                    <div class="dropdown-menu">
                        <a href="privacy.html">My Puzzle Alarm Clock</a>
                        <a href="https://leonavg.github.io/kawaii-rush/privacy.html">Kawaii Rush</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <h2>Welcome to LoSpider!</h2>
        <p></p>
    </main>

</body>
</html>
